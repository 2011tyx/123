name: Build Island

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tweak gradle memory
        run: echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Install Android SDK platform
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Pack KernelSU module zip
        run: |
          set -e
          rm -rf mod
          mkdir -p mod
          cp app/build/outputs/apk/debug/app-debug.apk mod/island.apk
          cat > mod/module.prop << 'EOF'
          id=sxc_island
          name=沈小词·灵动岛
          version=1.0
          versionCode=1
          author=沈小词
          description=刷入即自动装好灵动岛并开机自启，无需手动操作。
          EOF
          cat > mod/customize.sh << 'EOF'
          #!/system/bin/sh
          SKIPUNZIP=0
          ui_print "- 正在安装灵动岛 App..."
          pm install -r "$MODPATH/island.apk" >/dev/null 2>&1
          ui_print "- 已自动开启悬浮窗权限"
          appops set com.sxc.island SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1
          ui_print "- 完成！重启后灵动岛自动出现"
          EOF
          cat > mod/service.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
          sleep 12
          if ! pm list packages 2>/dev/null | grep -q com.sxc.island; then
            pm install -r "$MODDIR/island.apk"
            sleep 6
          fi
          appops set com.sxc.island SYSTEM_ALERT_WINDOW allow
          am start-foreground-service com.sxc.island/.IslandService
          while true; do
            sleep 60
            pgrep -f com.sxc.island >/dev/null 2>&1 || am start-foreground-service com.sxc.island/.IslandService
          done
          EOF
          cd mod
          zip -r ../sxc_island.zip .
          cd ..
          ls -lh sxc_island.zip

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: sxc_island_module
          path: sxc_island.zip
